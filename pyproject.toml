[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsequence-hierarchical-attention"
version = "1.6.0"
description = "Hierarchical attention DeepSequence for intermittent demand (feature contract v1.6)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mritunjay Kumar", email = "mritunjay.kmr1@gmail.com"}
]
keywords = ["time-series", "forecasting", "intermittent-demand", "deep-learning", "attention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "tensorflow>=2.13.0",
    "tensorflow-recommenders>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "PyYAML>=6.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "lightgbm>=4.0",
    "matplotlib>=3.7.0",
]
viz = [
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/mkuma93/DeepSequence"
Repository = "https://github.com/mkuma93/DeepSequence"
"Bug Tracker" = "https://github.com/mkuma93/DeepSequence/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsequence_hierarchical_attention*"]

[tool.setuptools.package-data]
deepsequence_hierarchical_attention = ["feature_config.yaml"]
